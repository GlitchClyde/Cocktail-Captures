<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocktail Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="booth">
    <div class="seg" id="modes" role="group" aria-label="Photo layout"></div>
    <div class="stagewrap strip" id="stagewrap">
      <canvas id="stage"></canvas>
      <div id="count" aria-live="assertive"></div>
      <div id="flash"></div>
    </div>
    <p id="status" role="status">Start the camera or upload a photo.</p>
    <div class="row" id="live-actions">
      <button id="btnCam">Start camera</button>
      <button id="btnSnap" class="primary" disabled>Take photo</button>
      <label class="btn">Upload photos<input id="file" type="file" accept="image/*" multiple hidden></label>
    </div>
    <div class="row" id="review-actions" hidden>
      <button id="btnRetake">Retake</button>
      <button id="btnRetakeAll">Retake all</button>
      <button id="btnSave" class="primary">Save to gallery</button>
      <button id="btnDownload">Download</button>
    </div>
    <div class="editor" id="editor" hidden>
      <h2 id="edtitle">Edit photo</h2>
      <label class="rng">Zoom <input type="range" id="ez" min="50" max="300" value="100"><output></output></label>
      <label class="rng">Left / right <input type="range" id="ex" min="-100" max="100" value="0"><output></output></label>
      <label class="rng">Up / down <input type="range" id="ey" min="-100" max="100" value="0"><output></output></label>
      <label class="rng">Rotate <input type="range" id="er" min="-180" max="180" value="0"><output></output></label>
      <div class="row">
        <select id="ef" aria-label="Filter">
          <option value="">Original</option><option value="grayscale(1)">Black and white</option>
          <option value="sepia(.8)">Vintage</option><option value="saturate(1.6) contrast(1.1)">Vivid</option>
          <option value="brightness(1.15)">Bright</option>
        </select>
        <button id="eflip">Flip</button><button id="ereset">Reset</button>
      </div>
      <p class="hint">Drag the photo to move it. Scroll to zoom. Click a photo in the strip to choose which one to edit.</p>
    </div>
  </section>
  <section class="card">
    <h2>Bar background</h2>
    <div id="scenes"></div>
    <div class="row between">
      <label class="chk"><input type="checkbox" id="props" checked> Bar props (shelf, sign, counter)</label>
      <label class="btn small">Use your own background<input id="bgfile" type="file" accept="image/*" hidden></label>
    </div>
    <label class="txt">Sign text <input id="sign" maxlength="28" value="COCKTAIL CAPTURE"></label>
  </section>
  <section class="gallery">
    <h2>Gallery</h2>
    <p id="empty">No photos yet. Saved photos show up here.</p>
    <div id="grid"></div>
  </section>
</main>
<script src="patterns.js"></script>
<script src="app.js"></script>
</body>
</html>
